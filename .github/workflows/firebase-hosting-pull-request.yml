name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
        env:
          REACT_APP_FIRESTORE_PROD_PERSONAL_SITE_KEY: ${{ secrets.REACT_APP_FIRESTORE_PROD_PERSONAL_SITE_KEY }}
          REACT_APP_FIRESTORE_PROD_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIRESTORE_PROD_AUTH_DOMAIN }}
          REACT_APP_FIRESTORE_PROD_DB_URL: ${{ secrets.REACT_APP_FIRESTORE_PROD_DB_URL }}
          REACT_APP_FIRESTORE_PROD_PROJECT_ID: ${{ secrets.REACT_APP_FIRESTORE_PROD_PROJECT_ID }}
          REACT_APP_FIRESTORE_PROD_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIRESTORE_PROD_STORAGE_BUCKET }}
          REACT_APP_FIRESTORE_PROD_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIRESTORE_PROD_MESSAGING_SENDER_ID }}
          REACT_APP_FIRESTORE_PROD_APP_ID: ${{ secrets.REACT_APP_FIRESTORE_PROD_APP_ID }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAIN_WEBSITE_5A5E8 }}
          projectId: main-website-5a5e8
